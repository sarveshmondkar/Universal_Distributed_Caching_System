name: CI

on:
  push:
  pull_request:

jobs:
  cache-node:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cache-node } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cache-node/package-lock.json }
      - run: npm ci
      - run: npm test

  router:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: router } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: router/package-lock.json }
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
